AWSTemplateFormatVersion: "2010-09-09"
Description: "Create DynamoDB table (job-metadata tracking) for e-commerce pipeline"

Resources:
  EcomJobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ecom_jobs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE